<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-nginx"><span class="hljs-comment"># кешировать по URL-запроса</span>
<span class="hljs-attribute">proxy_cache_key</span> <span class="hljs-string">&quot;<span class="hljs-variable">$host</span><span class="hljs-variable">$request_uri</span>&quot;</span>;

<span class="hljs-comment"># на 60 минут для успешных ответов</span>
<span class="hljs-attribute">proxy_cache_valid</span> <span class="hljs-number">200</span> <span class="hljs-number">302</span> <span class="hljs-number">60m</span>;

<span class="hljs-attribute">proxy_cache_valid</span> <span class="hljs-number">404</span>      <span class="hljs-number">1m</span>;
<span class="hljs-attribute">proxy_cache_min_uses</span> <span class="hljs-number">1</span>;
<span class="hljs-attribute">proxy_cache_methods</span> GET;
<span class="hljs-attribute">proxy_cache_background_update</span> <span class="hljs-literal">on</span>;
<span class="hljs-attribute">proxy_cache_revalidate</span> <span class="hljs-literal">on</span>;

<span class="hljs-attribute">add_header</span> X-Cache-Status <span class="hljs-variable">$upstream_cache_status</span>;
<span class="hljs-attribute">proxy_ignore_headers</span> Cache-Control;
<span class="hljs-attribute">proxy_pass</span> https://backend;
</code></pre>
</section>
